services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WORDPRESS_SITE_NAME: "My Awesome Blog"
        WORDPRESS_SITE_EMAIL: "admin@example.com"
      target: development
      cache_from:
        - wordpress:latest
      labels:
        maintainer: "Krishan Gordhan"
        version: "1.0"
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wp_database
    volumes:
      - ./wp-content:/var/www/html/wp-content
    networks:
      wordpress_network:
        ipv4_address: 192.168.1.2
    
  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wp_database
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      wordpress_network:
        ipv4_address: 192.168.1.3

volumes:
  db_data:
    labels:
      com.example.description: "Wordpress db storage"
      com.example.owner: "Krishan Gordhan"
      com.example.environment: "Development"

networks:
  wordpress_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1